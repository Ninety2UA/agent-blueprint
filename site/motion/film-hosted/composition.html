<!--
  The Hosted page's launch film (parent plan U14; BEATS.md, approved by ruling 79; style C, "One
  line", picked by ruling 83). 43 s at 1920 x 1080, 30 fps, scored by score.py.

  Skills carried in it: the launch-video skill's method and the approved beats (one sentence over four
  beats, the product working, a proof beat, the call to action); the brand from brand-intake
  (r2/brand.md and r2/MOTION.md: paper, ink, hairlines, Archivo, one accent element per frame);
  motion-effects 15 (Flowing paths: an ink square draws each line and the node it reaches answers) in
  beats 2, 4 and 5, and 03 (Card to workspace) where the web chat card opens into the chat; html-demo's
  View(t) rules for the chat in beat 3 (every state from t alone, named times, the field typed at an
  even pace, every word from eve/apps/web); the motion references in the design workspace's
  BREAKDOWN.md (Jev's hook built line by line and its inputs joined by one hairline, Alan's stages
  taking the accent in turn on one line, Anveril's marker before its label, Celld's square into the
  labelled box and the single line to the one repository, Klairon's fragment replaced in place while
  the drawing changes); and the HyperFrames library's mechanics without its styles (modal-morph's
  measure-once shell, offset-path-traveler's one progress value sampled on a path, pan-stations'
  dwell and lateral move), restyled to MOTION.md.

  HyperFrames contract: one paused GSAP timeline registered as window.__timelines["main"] after the
  fonts load; its single clock tween draws every frame from its time alone (no timers, no randomness,
  no CSS animation). window.seek(t) draws the same frame for checks. Words on screen are the beat
  sheet's, plus the demo's address on the end card (ruling 79).
-->

<script>
(() => {
  "use strict";
  const D = 43;
  const NS = "http://www.w3.org/2000/svg";
  // r2/MOTION.md section 1, light only (the site shows the film dark through its invert filter)
  const COL = { ground: "#fafafa", sunk: "#f1f1f1", raised: "#ffffff", ink: "#0f0f0f", ink2: "#383838", muted: "#555555", hairS: "#b1b1b1", hair: "#d4d4d4", accent: "#ed4423", accentFill: "#cf300c" };

  // ---- easing (MOTION.md answers): entrances expo out, returns in-out, pans slow start, soft landing ----
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (u) => ((ax * u + bx) * u + cx) * u, sy = (u) => ((ay * u + by) * u + cy) * u;
    const dx = (u) => (3 * ax * u + 2 * bx) * u + cx;
    return (x) => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let u = x;
      for (let i = 0; i < 8; i++) { const e = sx(u) - x, d = dx(u); if (Math.abs(e) < 1e-7 || Math.abs(d) < 1e-6) break; u -= e / d; }
      let lo = 0, hi = 1;
      for (let i = 0; i < 30 && Math.abs(sx(u) - x) > 1e-7; i++) { if (sx(u) < x) lo = u; else hi = u; u = (lo + hi) / 2; }
      return sy(u);
    };
  }
  const EXPO = bezier(0.16, 1, 0.3, 1);
  const INOUT = bezier(0.65, 0, 0.35, 1);
  const PAN = bezier(0.45, 0, 0.25, 1);
  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const seg = (t, a, d) => clamp((t - a) / d);
  const hex = (c) => [1, 3, 5].map((i) => parseInt(c.slice(i, i + 2), 16));
  const mix = (a, b, t) => { const A = hex(a), B = hex(b); return "#" + A.map((v, i) => Math.round(lerp(v, B[i], clamp(t))).toString(16).padStart(2, "0")).join(""); };
  const f3 = (v) => (+v).toFixed(3);
  function S(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const k in attrs || {}) if (attrs[k] != null) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; }
  function T(parent, x, y, cls, str, fill, anchor) { const e = S("text", { x, y, class: cls, fill, "text-anchor": anchor }, parent); e.textContent = str; return e; }
  // text fades in place from strong hairline grey to its colour; `out` fades it away again
  function fadeText(el, t, start, color, dur = 0.3, out = Infinity) {
    el.setAttribute("opacity", f3(seg(t, start, 0.1) * (1 - seg(t, out, 0.3))));
    el.setAttribute("fill", mix(COL.hairS, color, seg(t, start, dur)));
  }
  function lineEl(parent, d, stroke, w) { return S("path", { d, fill: "none", stroke, "stroke-width": w, pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1, opacity: 0 }, parent); }
  function drawLine(el, p) { el.setAttribute("stroke-dashoffset", f3(1 - p)); el.setAttribute("opacity", p > 0.0005 ? 1 : 0); }
  // a path sampled once at mount (no layout reads while the timeline draws), then read by fraction
  function sampled(el, n = 240) {
    const L = el.getTotalLength();
    return Array.from({ length: n + 1 }, (_, i) => { const q = el.getPointAtLength((L * i) / n); return { x: q.x, y: q.y }; });
  }
  function along(pts, p) {
    const f = clamp(p) * (pts.length - 1), i = Math.min(pts.length - 2, Math.floor(f)), u = f - i;
    return { x: lerp(pts[i].x, pts[i + 1].x, u), y: lerp(pts[i].y, pts[i + 1].y, u) };
  }
  // the moment an INOUT run of length `dur` from `start` reaches fraction `frac` of its way
  function reach(frac, start, dur) { let lo = 0, hi = 1; for (let j = 0; j < 30; j++) { const m = (lo + hi) / 2; if (INOUT(m) < frac) lo = m; else hi = m; } return start + lo * dur; }
  // a square riding a path: shown only while it travels
  function ride(sq, path, p) {
    if (p > 0 && p < 1) { const q = along(path, p); sq.setAttribute("x", f3(q.x - 6)); sq.setAttribute("y", f3(q.y - 6)); sq.setAttribute("opacity", 1); }
    else sq.setAttribute("opacity", 0);
  }
  // the dot of a node: waiting (hairline), on (ink ring), live (accent)
  function node(dot, on, live, fill = COL.raised) {
    dot.setAttribute("stroke", live > 0 ? mix(COL.ink, COL.accent, live) : mix(COL.hairS, COL.ink, on));
    dot.setAttribute("fill", live > 0 ? mix(fill, COL.accent, live) : fill);
  }

  const svg = document.getElementById("s");
  const world = S("g", {}, svg); // the camera's plane: the chat (sheet 1), the sandbox and the run panel
  const intro = S("g", {}, svg); // beats 1 and 2, before the web chat card opens
  const over = S("g", {}, svg);  // the opening's ghost and guides, in screen space
  const hud = S("g", {}, svg);   // the end card, in screen space
  const defs = S("defs", {}, svg);

  // Layout (ruling 84): every settled composition is centred on the frame's vertical axis and, with

  // ================= beats 1 and 2: the sentence and the five ways to ask =================
  // data-unit marks each line, row and group that layout-check.cjs holds to the frame's vertical axis
  const unit = (el, name) => (el.setAttribute("data-unit", name), el);
  const heading = unit(T(intro, 960, 196, "t-head", "Agent Blueprint, hosted.", COL.ink, "middle"), "heading");
  const FRAG1 = ["Ask for a change", "where you already work,"];
  const frag1 = FRAG1.map((l, i) => unit(T(intro, 960, 380 + i * 112, "t-display", l, COL.ink, "middle"), `fragment 1, line ${i + 1}`));
  const ROW = { x: 160, w: 1600, y: 690, h: 168, gap: 24 };
  const CW = (ROW.w - 4 * ROW.gap) / 5;
  const LINE_Y = ROW.y - 52;
  // the ask strings of site/src/components/hosted/Steps.astro (CHANNELS), capitalised as its askLine does

  const RUN2 = [4.3, 1.4];
  const rowG = S("g", { "data-unit": "card row" }, intro);
  const line2 = lineEl(rowG, `M${ROW.x} ${LINE_Y} H${ROW.x + ROW.w}`, COL.hairS, 1.25);
  const sq2 = S("rect", { width: 12, height: 12, fill: COL.ink, opacity: 0 }, rowG);
  const cards = CH.map((words, i) => {
    const x = ROW.x + i * (CW + ROW.gap), cx = x + 32;
    const g = S("g", {}, rowG);
    const drop = lineEl(g, `M${cx} ${LINE_Y} V${ROW.y}`, COL.hairS, 1.25);
    const box = S("rect", { x: x + 0.75, y: ROW.y + 0.75, width: CW - 1.5, height: ROW.h - 1.5, fill: COL.raised, stroke: COL.hairS, "stroke-width": 1.5, opacity: 0 }, g);
    const dot = S("circle", { cx, cy: ROW.y + 38, r: 10, fill: COL.raised, stroke: COL.hairS, "stroke-width": 1.5, opacity: 0 }, g);
    const labs = words.map((w, j) => T(g, x + 32, ROW.y + 98 + j * 40, "t-label", w, COL.ink));
    return { x, drop, box, dot, labs, at: reach((cx - ROW.x) / ROW.w, ...RUN2) };
  });
  // the intro's camera: the sentence alone is centred (beat 1), then the frame moves down to centre the
  // sentence and the card row together (beat 2); the heading, the sentence and the row share x = 960
  const INTRO_Y = [202, 30], INTRO_MOVE = [4.0, 0.9];
  const introY = (t) => lerp(INTRO_Y[0], INTRO_Y[1], INOUT(seg(t, ...INTRO_MOVE)));

  // ================= sheet 1: the chat (beat 3), opened from the web chat card =================
  // The deployer's own chat (ruling 79), redrawn flat from eve/apps/web: title-block.tsx ("New
  // session"), home-chat-page.tsx (the field label "Your request"), composer.tsx (submitLabel
  // "Send"), run-panel.tsx (the cells "Sheet", "Branch", "Stages" and the five stage rows waiting).
  const SHEET = { x: 160, y: 110, w: 1600, h: 860 };
  const MORPH = [8.6, 1.3];
  const c0 = { x: cards[0].x, y: ROW.y, w: CW, h: ROW.h };
  const ghost = S("rect", { fill: "none", stroke: COL.hairS, "stroke-width": 1.25, "stroke-dasharray": "7 6", opacity: 0 }, over);
  const guides = [0, 1].map(() => S("line", { stroke: COL.hairS, "stroke-width": 1, "stroke-dasharray": "6 6", opacity: 0 }, over));
  const sheet1 = S("g", { "data-unit": "chat sheet" }, world);
  const shell = S("rect", { fill: COL.raised, stroke: COL.ink, "stroke-width": 1.5, opacity: 0 }, sheet1);
  const clipR = S("rect", {}, S("clipPath", { id: "shellclip" }, defs));
  const inner = S("g", { "clip-path": "url(#shellclip)", opacity: 0 }, sheet1);
  const chat = S("g", {}, inner);
  const PANEL_X = Math.round(SHEET.w * 0.64);
  const FB = { x: 64, y: SHEET.h - 268, w: PANEL_X - 128, h: 196 }; // the composer field
  T(chat, 64, 78, "t-quiet", "Example run", COL.muted);
  T(chat, 64, 168, "t-chat-h", "New session", COL.ink);
  S("rect", { x: PANEL_X, y: 1, width: SHEET.w - PANEL_X - 1, height: SHEET.h - 2, fill: COL.sunk }, chat);
  S("line", { x1: PANEL_X, y1: 0, x2: PANEL_X, y2: SHEET.h, stroke: COL.hair, "stroke-width": 1 }, chat);
  T(chat, FB.x, FB.y - 22, "t-quiet", "Your request", COL.muted);
  S("rect", { x: FB.x + 0.75, y: FB.y + 0.75, width: FB.w - 1.5, height: FB.h - 1.5, fill: COL.raised, stroke: COL.ink, "stroke-width": 1.5 }, chat);
  const SEND = { x: FB.x + FB.w - 24 - 150, y: FB.y + FB.h - 24 - 60, w: 150, h: 60 };
  const sendBox = S("rect", { x: SEND.x + 0.75, y: SEND.y + 0.75, width: SEND.w - 1.5, height: SEND.h - 1.5, fill: COL.raised, stroke: COL.ink, "stroke-width": 1.5 }, chat);
  const sendText = T(chat, SEND.x + SEND.w / 2, SEND.y + SEND.h / 2 + 11, "t-btn", "Send", COL.ink, "middle");
  {
    const cx = PANEL_X + 48;

  // the request: the demo's second suggested request (eve/apps/web/components/chat/gate-notice.tsx)
  const REQUEST = "Add input validation to the main function so an empty argument gives a clear error message, with a test.";
  const typedG = S("g", {}, chat);
  const caret = S("rect", { width: 2.5, height: 34, fill: COL.ink, opacity: 0 }, chat);

  // ================= sheet 2: the sandbox and the repository (beat 4) =================

  const XC4 = 2880;
  const s2 = S("g", {}, world);

  const SB = { x: XC4 - 570, y: 490, w: 560, h: 340 };

  // the run's status: the node and the chat's word for a live run (sidebar.tsx), one element

  const sbDot = S("circle", { cx: SB.x + SB.w - 200, cy: SB.y + 50, r: 11, fill: COL.sunk, stroke: COL.hairS, "stroke-width": 1.5, opacity: 0 }, liveG);
  const sbRun = T(liveG, SB.x + SB.w - 178, SB.y + 61, "t-label", "Running", COL.accentFill);
  const sbToRepo = lineEl(s2, `M${SB.x + SB.w} 660 H${XC4 + 190}`, COL.hairS, 1.25);
  // the repository outline is the hinge between beats 4 and 5: it stays on screen through the pan
  const REPO = { x: XC4 + 190, y: 560, w: 380, h: 200 };
  const repoBox = S("rect", { x: REPO.x + 0.75, y: REPO.y + 0.75, width: REPO.w - 1.5, height: REPO.h - 1.5, fill: "none", stroke: COL.hairS, "stroke-width": 1.5, opacity: 0, "data-unit": "repository" }, world);
  const repoLabel = T(world, REPO.x + REPO.w / 2, REPO.y + REPO.h / 2 + 12, "t-cell", "Your repository", COL.muted, "middle");
  // the request travels from its message in the chat into the sandbox
  const sq4 = S("rect", { width: 12, height: 12, fill: COL.ink, opacity: 0 }, world);
  let path4 = null, tail4 = null;
  const SQ4 = [18.3, 1.2];
  const S2_IN = 18.8, S2_OUT = [23.85, 0.35];

  // ================= sheet 3: the run panel (beats 5 and 6) =================
  // One centred group with the repository: the repository at left, the run panel at right, the
  // fragment centred over both and the caption centred under them.
  const XC5 = XC4 + 1010;
  const s3 = S("g", {}, world);
  const frag3 = unit(T(s3, XC5, 310, "t-frag", "pushes each stage as it finishes", COL.ink, "middle"), "fragment 3");
  const frag4 = ["and opens the pull request", "as your GitHub App."].map((l, i) => unit(T(s3, XC5, 218 + i * 92, "t-frag", l, COL.ink, "middle"), `fragment 4, line ${i + 1}`));
  const PN = { x: REPO.x + REPO.w + 160, y: 400, w: 1100, h: 520 };
  const panelG = S("g", { opacity: 0 }, s3);
  S("rect", { x: PN.x + 0.5, y: PN.y + 0.5, width: PN.w - 1, height: PN.h - 1, fill: COL.sunk, stroke: COL.hair, "stroke-width": 1, "data-unit": "run panel" }, panelG);
  S("line", { x1: PN.x + 640, y1: PN.y + 40, x2: PN.x + 640, y2: PN.y + PN.h - 40, stroke: COL.hair, "stroke-width": 1 }, panelG);
  T(panelG, PN.x + 40, PN.y + 70, "t-cell", "Branch", COL.ink);
  S("line", { x1: PN.x + 40, y1: PN.y + 116, x2: PN.x + 600, y2: PN.y + 116, stroke: COL.hair, "stroke-width": 1 }, panelG);
  // the branch's five places, one per stage, on the label's x-height line: each fills as its stage is pushed
  const SLOT = { x: PN.x + 220, y: PN.y + 70 - 20, size: 16, gap: 12 };
  const slots = [0, 1, 2, 3, 4].map((i) => {
    const x = SLOT.x + i * (SLOT.size + SLOT.gap);
    const out = S("rect", { x: x + 0.5, y: SLOT.y + 0.5, width: SLOT.size - 1, height: SLOT.size - 1, fill: "none", stroke: COL.hairS, "stroke-width": 1 }, panelG);
    const fill = S("rect", { x, y: SLOT.y, width: SLOT.size, height: SLOT.size, fill: COL.ink, opacity: 0 }, panelG);
    return { x, out, fill };
  });
  T(panelG, PN.x + 40, PN.y + 200, "t-cell", "Pull request", COL.ink);
  const PRB = { x: PN.x + 40, y: 628, w: 240, h: 64 };
  const OPB = { x: PN.x + 304, y: 628, w: 300, h: 64 };
  const prBox = S("rect", { x: PRB.x + 0.75, y: PRB.y + 0.75, width: PRB.w - 1.5, height: PRB.h - 1.5, fill: COL.sunk, stroke: COL.hairS, "stroke-width": 1.5 }, panelG);
  const prText = T(panelG, PRB.x + PRB.w / 2, PRB.y + PRB.h / 2 + 11, "t-btn", "Pull request", COL.muted, "middle");
  const opBox = S("rect", { x: OPB.x + 0.75, y: OPB.y + 0.75, width: OPB.w - 1.5, height: OPB.h - 1.5, fill: COL.sunk, stroke: COL.hairS, "stroke-width": 1.5 }, panelG);
  const opText = T(panelG, OPB.x + OPB.w / 2, OPB.y + OPB.h / 2 + 11, "t-btn", "Open the branch", COL.muted, "middle");
  T(panelG, PN.x + 680, PN.y + 70, "t-cell", "Stages", COL.ink);
  const STAGE0 = 25.0, STEP = 1.2;
  const stages = ["Plan", "Execute", "Review", "Verify", "Ship"].map((name, i) => {
    const y = PN.y + 140 + i * 72, rx = PN.x + 710;
    const ring = S("circle", { cx: rx, cy: y, r: 13, fill: COL.sunk, stroke: COL.hairS, "stroke-width": 1.5 }, panelG);
    const tick = S("path", { d: `M${rx - 5.5} ${y + 0.5} L${rx - 2} ${y + 4} L${rx + 5.5} ${y - 4}`, fill: "none", stroke: COL.ground, "stroke-width": 2.5, "stroke-linecap": "square", pathLength: 1, "stroke-dasharray": "1 1", "stroke-dashoffset": 1 }, panelG);
    const lab = T(panelG, rx + 36, y + 12, "t-label", name, COL.muted);
    // each finished stage sends a square up into its place on the branch
    const sx = slots[i].x + SLOT.size / 2, sy = SLOT.y + SLOT.size / 2;
    const d = `M${rx - 20} ${y} H${PN.x + 660} V${sy} H${sx}`;
    const path = S("path", { d, fill: "none", stroke: "none" }, panelG);
    const trail = lineEl(panelG, d, COL.hairS, 1);
    const sq = S("rect", { width: SLOT.size, height: SLOT.size, fill: COL.ink, opacity: 0 }, panelG);
    const t0 = STAGE0 + i * STEP;
    return { ring, tick, lab, path, trail, sq, slot: slots[i], live: t0, done: t0 + 0.9, send: t0 + 1.2 };
  });
  // beat 6: the one straight line from the pull request to the one repository the App reaches
  const prToRepo = lineEl(world, `M${PRB.x} ${REPO.y + REPO.h / 2} H${REPO.x + REPO.w}`, COL.ink, 1.5);
  const PR_AT = 33.0, LINE6 = [33.3, 0.7];
  const S3_IN = [25.05, 0.35];
  const cap5 = unit(T(s3, XC5, PN.y + PN.h + 64, "t-body", "A sandbox that stops at its limit loses no finished stage.", COL.ink2, "middle"), "caption 5");
  const cap6 = unit(T(s3, XC5, PN.y + PN.h + 64, "t-body", "It asks you first, and it reaches only the repository your App is installed on.", COL.ink2, "middle"), "caption 6");

  // ================= beat 7: the end card, centred (screen space) =================
  // The world steps back and clears; the card builds alone in the middle of the frame. The mark is
  // site/public/brand/mark.svg exactly (its 28-unit grid at 4x), built cell by cell.
  const Y0 = 294;
  const mark = S("g", { transform: `translate(904 ${Y0}) scale(4)`, "data-unit": "mark" }, hud);
  const inkCells = [[0, 0], [10, 0], [10, 10], [20, 10]].map(([x, y]) => S("rect", { x, y, width: 8, height: 8, fill: "#0f0f0f", opacity: 0 }, mark));
  const outCells = [[20.5, 0.5], [0.5, 10.5], [0.5, 20.5], [10.5, 20.5]].map(([x, y]) => S("rect", { x, y, width: 7, height: 7, fill: "none", stroke: "#9e9e9e", "stroke-width": 1, opacity: 0 }, mark));
  const endCell = S("rect", { x: 20, y: 20, width: 8, height: 8, fill: "#ed4423", opacity: 0 }, mark);
  const endTitle = unit(T(hud, 960, Y0 + 226, "t-end", "Agent Blueprint, hosted.", COL.ink, "middle"), "end title");
  const endLine = unit(T(hud, 960, Y0 + 288, "t-body", "On your own Vercel account, Railway or server.", COL.ink2, "middle"), "end line");
  const BTN_Y = Y0 + 320, BTN_H = 64;
  const btns = [{ label: "Deploy", w: 200 }, { label: "Try the demo", w: 300 }];
  const btnRow = S("g", { "data-unit": "button row" }, hud);
  const btnGap = 24, btnX0 = 960 - (btns[0].w + btnGap + btns[1].w) / 2;
  btns.forEach((b, i) => {
    b.x = i === 0 ? btnX0 : btnX0 + btns[0].w + btnGap;
    b.box = S("rect", { x: b.x + 0.75, y: BTN_Y + 0.75, width: b.w - 1.5, height: BTN_H - 1.5, fill: "none", stroke: COL.ink, "stroke-width": 1.5, opacity: 0 }, btnRow);
    b.text = T(btnRow, b.x + b.w / 2, BTN_Y + BTN_H / 2 + 11, "t-btn", b.label, COL.ink, "middle");
  });
  // the address sits on the frame's axis directly under the button row (ruling 84 follow-up)
  const endAddr = unit(T(hud, 960, Y0 + 432, "t-small", "try.agent-blueprint.dbenger.com", COL.ink2, "middle"), "address");
  const endNote = unit(T(hud, 960, Y0 + 488, "t-small", "This demo opens with a code, and the code comes in Dominik's message to you.", COL.ink2, "middle"), "demo sentence");

  // ================= the camera =================
  // states are affine: screen = world * k + (tx, ty); each move eases between two states
  const zoomAt = (k, px, py, sx = px, sy = py) => ({ k, tx: sx - px * k, ty: sy - py * k });
  const C0 = { k: 1, tx: 0, ty: 0 };
  const C1 = zoomAt(1.05, 960, SHEET.y + FB.y + FB.h / 2); // toward the field's row, on the frame's axis, the sheet kept inside the safe area
  const C2 = { k: 1, tx: 960 - XC4, ty: 0 };
  const C3 = { k: 1, tx: 960 - XC5, ty: -48 };
  const C3b = { k: 1, tx: 960 - XC5, ty: -62 };                                   // a slow drift down the rows
  const C5 = { k: 1, tx: 960 - XC5, ty: -40 };                                    // the whole group with fragment 4 and its caption
  const prW = { x: PRB.x + PRB.w / 2, y: PRB.y + PRB.h / 2 };
  const C4 = zoomAt(1.04, prW.x, prW.y, prW.x + C5.tx, prW.y + C5.ty);           // onto the Pull request cell
  const C6 = { k: 0.85, tx: 960 + (C5.tx - 960) * 0.85, ty: 540 + (C5.ty - 540) * 0.85 }; // stepping back as the world clears
  const MOVES = [
    [10.35, 5.65, C0, C1, INOUT], [18.0, 1.35, C1, C2, PAN], [24.0, 1.35, C2, C3, PAN], [25.35, 5.65, C3, C3b, INOUT],
    [32.0, 1.0, C3b, C4, EXPO], [34.0, 1.0, C4, C5, INOUT], [37.0, 1.0, C5, C6, INOUT],
  ];
  function camera(t) {
    let c = C0;
    for (const [a, d, from, to, ease] of MOVES) {
      if (t < a) break;
      const p = ease(seg(t, a, d));
      c = { k: lerp(from.k, to.k, p), tx: lerp(from.tx, to.tx, p), ty: lerp(from.ty, to.ty, p) };
    }
    return c;
  }
  // for layout-check.cjs: frames inside a pan or a camera move, and the settled stretches whose content
  // must sit centred (horizontally within 1 percent, vertically in the optical band)
  window.__layout = {
    moves: [[4.0, 4.9], [8.6, 9.9], [10.35, 16.0], [18.0, 19.35], [24.0, 25.35], [32.0, 33.0], [34.0, 35.0], [37.0, 38.0]],
    settled: [[1.7, 4.0], [5.9, 8.6], [16.0, 17.75], [20.4, 23.85], [25.45, 31.0], [31.4, 32.0], [35.0, 37.0], [39.6, 43.0]],
    safe: { x: 96, y: 54, w: 1728, h: 972 },
    band: [500, 570],
  };

  // ================= measured once, after the fonts load =================
  function measure() {
    // wrap the request to the field's width, minus its padding
    const probe = T(chat, 0, 0, "t-type", "", COL.ink);
    const words = REQUEST.split(" ");
    let cur = "";
    for (const w of words) {
      const next = cur ? `${cur} ${w}` : w;
      probe.textContent = next;
      if (probe.getComputedTextLength() > FB.w - 64 && cur) { wrapped.push(cur); cur = w; } else cur = next;
    }
    wrapped.push(cur);
    // the caret's place after each typed prefix of each line
    caretX = wrapped.map((l) => Array.from({ length: l.length + 1 }, (_, k) => { probe.textContent = l.slice(0, k); return k ? probe.getComputedTextLength() : 0; }));
    probe.remove();
    stages.forEach((st) => (st.pts = sampled(st.path)));
    typedLines = wrapped.map((l, j) => T(typedG, FB.x + 28, FB.y + 50 + j * 42, "t-type", "", COL.ink));
    msgLines = wrapped.map((l, j) => T(msgG, MSG.x + 28, MSG.y + 54 + j * 42, "t-type", l, COL.ink));
    msgBox.setAttribute("width", FB.w - 1);
    msgBox.setAttribute("height", 54 + (wrapped.length - 1) * 42 + 30);
    // the request's square leaves the message's right end and lands inside the sandbox
    const mx = SHEET.x + MSG.x + FB.w, my = SHEET.y + MSG.y + 40;
    const tx = SB.x + SB.w - 100, ty = SB.y + SB.h - 70;
    const d4 = `M${mx} ${my} C${mx + 600} ${my} ${tx - 700} ${ty} ${tx} ${ty}`;
    path4 = sampled(S("path", { d: d4, fill: "none", stroke: "none" }, world));
    // a short hairline tail behind the square, so its run reads as the request travelling
    tail4 = S("path", { fill: "none", stroke: COL.ink, "stroke-width": 1.25, opacity: 0 }, world);
  }

  function draw(t) {
    // ---- beat 1: the sentence, built line by line ----
    fadeText(heading, t, 0.75, COL.ink, 0.25);
    frag1.forEach((e, i) => fadeText(e, t, 1.25 + i * 0.12, COL.ink, 0.25));
    // ---- beat 2: the square runs the line; each card answers as it passes ----
    const run = INOUT(seg(t, ...RUN2));
    drawLine(line2, run);
    if (run > 0 && run < 1) { sq2.setAttribute("x", f3(ROW.x + ROW.w * run - 6)); sq2.setAttribute("y", f3(LINE_Y - 6)); sq2.setAttribute("opacity", 1); }
    else sq2.setAttribute("opacity", 0);
    cards.forEach((c, i) => {
      drawLine(c.drop, EXPO(seg(t, c.at, 0.25)));
      const on = seg(t, c.at + 0.15, 0.3);
      c.box.setAttribute("opacity", f3(seg(t, c.at + 0.15, 0.1)));
      c.box.setAttribute("stroke", mix(COL.hairS, COL.ink, on));
      c.drop.setAttribute("stroke", mix(COL.hairS, COL.ink, on));
      c.dot.setAttribute("opacity", f3(seg(t, c.at + 0.15, 0.1)));
      node(c.dot, on, i === 0 ? seg(t, 7.2, 0.3) * (1 - seg(t, MORPH[0], 0.3)) : 0);
      c.labs.forEach((l, j) => fadeText(l, t, c.at + 0.2 + j * 0.09, COL.ink));
    });
    const iy = introY(t);
    intro.setAttribute("transform", `translate(0 ${f3(iy)})`);
    intro.setAttribute("opacity", f3(1 - seg(t, MORPH[0], 0.4)));

    // ---- 8.6 s: the web chat card opens into the chat (the world camera is at rest) ----
    const p = EXPO(seg(t, ...MORPH));
    const a = t >= MORPH[0] ? 1 : 0;
    const s0 = { x: c0.x, y: c0.y + iy, w: c0.w, h: c0.h };
    const r = { x: lerp(s0.x, SHEET.x, p), y: lerp(s0.y, SHEET.y, p), w: lerp(s0.w, SHEET.w, p), h: lerp(s0.h, SHEET.h, p) };
    shell.setAttribute("x", f3(r.x + 0.75)); shell.setAttribute("y", f3(r.y + 0.75));
    shell.setAttribute("width", f3(r.w - 1.5)); shell.setAttribute("height", f3(r.h - 1.5));
    shell.setAttribute("opacity", a);
    clipR.setAttribute("x", f3(r.x + 1.5)); clipR.setAttribute("y", f3(r.y + 1.5));
    clipR.setAttribute("width", f3(Math.max(0, r.w - 3))); clipR.setAttribute("height", f3(Math.max(0, r.h - 3)));
    const ghostA = a * seg(t, MORPH[0] + 0.05, 0.3) * (1 - seg(t, 9.95, 0.35)); // the ghost clears before the push-in
    ghost.setAttribute("x", f3(s0.x + 0.75)); ghost.setAttribute("y", f3(s0.y + 0.75));
    ghost.setAttribute("width", f3(s0.w - 1.5)); ghost.setAttribute("height", f3(s0.h - 1.5));
    ghost.setAttribute("opacity", f3(ghostA));
    [[s0.x, s0.y, r.x, r.y + r.h], [s0.x + s0.w, s0.y, r.x + r.w, r.y + r.h]].forEach(([x1, y1, x2, y2], i) => {
      const g = guides[i];
      g.setAttribute("x1", f3(x1)); g.setAttribute("y1", f3(y1)); g.setAttribute("x2", f3(x2)); g.setAttribute("y2", f3(y2));
      g.setAttribute("opacity", f3(a * seg(t, MORPH[0] + 0.1, 0.4) * (1 - seg(t, 9.95, 0.35)) * (y2 > y1 + 2 ? 1 : 0)));
    });
    chat.setAttribute("transform", `translate(${f3(r.x)} ${f3(r.y)})`);
    inner.setAttribute("opacity", f3(seg(t, MORPH[0] + 0.45, 0.35)));
    sheet1.setAttribute("opacity", f3(1 - seg(t, ...CHAT_OUT)));

    // ---- beat 3: the request types into "Your request" at an even pace, then Send ----
    const n = Math.floor(REQUEST.length * seg(t, ...TYPE));
    let left = n, last = null, lastLen = 0, lastJ = 0;
    typedLines.forEach((el, j) => {
      const full = wrapped[j];
      const show = Math.max(0, Math.min(full.length, left));
      el.textContent = full.slice(0, show);
      left -= full.length + 1;
      if (show > 0 || j === 0) { last = el; lastLen = show; lastJ = j; }
    });
    typedG.setAttribute("opacity", f3(1 - seg(t, MOVE[0], 0.25)));
    if (last) {
      caret.setAttribute("x", f3(FB.x + 28 + caretX[lastJ][lastLen] + 3));
      caret.setAttribute("y", f3(+last.getAttribute("y") - 27));
    }
    // the caret shows from the field's focus to the send; it blinks only while nothing types
    const typing = t >= TYPE[0] && t <= TYPE[0] + TYPE[1];
    const blinkOn = typing || Math.floor((t - 10.35) * 2) % 2 === 0;
    caret.setAttribute("opacity", t >= 10.35 && t < SEND_AT && blinkOn ? 1 : 0);
    const press = seg(t, SEND_AT, 0.08) * (1 - seg(t, SEND_AT + 0.3, 0.3)); // the press: accent fill, then back
    sendBox.setAttribute("fill", mix(COL.raised, COL.accentFill, press));
    sendBox.setAttribute("stroke", mix(COL.ink, COL.accentFill, press));
    sendText.setAttribute("fill", mix(COL.ink, COL.raised, press));
    msgG.setAttribute("opacity", f3(seg(t, MOVE[0], MOVE[1])));
    msgLines.forEach((el) => el.setAttribute("fill", mix(COL.hairS, COL.ink, seg(t, MOVE[0] + 0.2, 0.5))));

    // ---- beat 4: the request goes into the sandbox; the group builds as one ----
    if (path4) {
      const q4 = EXPO(seg(t, ...SQ4));
      ride(sq4, path4, q4);
      // the tail is the stretch of the sampled path just behind the square, redrawn from the samples
      const p0 = Math.max(0, q4 - 0.16), steps = 24;
      const pts = Array.from({ length: steps + 1 }, (_, i) => along(path4, lerp(p0, q4, i / steps)));
      tail4.setAttribute("d", "M" + pts.map((q) => `${f3(q.x)} ${f3(q.y)}`).join(" L"));
      tail4.setAttribute("opacity", q4 > 0 ? f3(1 - seg(t, SQ4[0] + SQ4[1], 0.3)) : 0);
    }
    const s2Out = 1 - seg(t, ...S2_OUT);
    s2.setAttribute("opacity", f3(s2Out));
    frag2.forEach((e, i) => fadeText(e, t, S2_IN + i * 0.12, COL.ink, 0.3));
    sbBox.setAttribute("opacity", f3(seg(t, S2_IN + 0.1, 0.3)));
    repoBox.setAttribute("opacity", f3(seg(t, S2_IN + 0.1, 0.3)));
    fadeText(sbLabel, t, S2_IN + 0.2, COL.ink);
    sbInner.forEach((e, i) => fadeText(e, t, 19.6 + i * 0.09, COL.ink));
    const live4 = seg(t, 20.0, 0.3), settle4 = seg(t, 23.5, 0.3);
    sbDot.setAttribute("opacity", f3(seg(t, 20.0, 0.1)));
    node(sbDot, 1, live4 * (1 - settle4), COL.sunk);
    if (settle4 > 0) { sbDot.setAttribute("stroke", mix(COL.accent, COL.ink, settle4)); sbDot.setAttribute("fill", mix(COL.accent, COL.ink, settle4)); }
    sbRun.setAttribute("opacity", f3(seg(t, 20.0, 0.1)));
    sbRun.setAttribute("fill", settle4 > 0 ? mix(COL.accentFill, COL.ink, settle4) : mix(COL.hairS, COL.accentFill, live4));
    fadeText(repoLabel, t, S2_IN + 0.2, COL.muted);
    drawLine(sbToRepo, EXPO(seg(t, 20.4, 0.5)));

    // ---- beat 5: each stage runs in turn and is pushed into its place on the branch ----
    panelG.setAttribute("opacity", f3(seg(t, ...S3_IN)));
    fadeText(frag3, t, S3_IN[0], COL.ink, 0.3, 32.0);
    stages.forEach((s) => {
      const live = seg(t, s.live, 0.15), done = seg(t, s.done, 0.3);
      const fillC = done > 0 ? mix(COL.accent, COL.ink, done) : mix(COL.sunk, COL.accent, live);
      const strokeC = done > 0 ? mix(COL.accent, COL.ink, done) : mix(COL.hairS, COL.accent, live);
      s.ring.setAttribute("fill", fillC);
      s.ring.setAttribute("stroke", strokeC);
      s.tick.setAttribute("stroke-dashoffset", f3(1 - EXPO(done)));
      s.lab.setAttribute("fill", mix(COL.muted, COL.ink, live));
      const go = INOUT(seg(t, s.send, 0.8));
      drawLine(s.trail, go);
      s.trail.setAttribute("opacity", go > 0 ? f3(1 - seg(t, s.send + 0.8, 0.4)) : 0);
      if (go > 0 && go < 1) { const q = along(s.pts, go); s.sq.setAttribute("x", f3(q.x - SLOT.size / 2)); s.sq.setAttribute("y", f3(q.y - SLOT.size / 2)); s.sq.setAttribute("opacity", 1); }
      else s.sq.setAttribute("opacity", 0);
      const filled = t >= s.send + 0.8 ? 1 : 0;
      s.slot.fill.setAttribute("opacity", filled);
      s.slot.out.setAttribute("stroke", filled ? COL.ink : COL.hairS);
    });
    fadeText(cap5, t, 31.0, COL.ink2, 0.3, 32.0);

    // ---- beat 6: the pull request opens as your GitHub App ----
    frag4.forEach((e, i) => fadeText(e, t, 32.3 + i * 0.12, COL.ink, 0.3));
    const prIn = seg(t, 32.6, 0.3), prLive = seg(t, PR_AT, 0.15), prSettle = seg(t, 37.0, 0.3);
    const prFill = prSettle > 0 ? mix(COL.accentFill, COL.ink, prSettle) : mix(COL.sunk, COL.accentFill, prLive);
    prBox.setAttribute("fill", prFill);
    prBox.setAttribute("stroke", prLive > 0 ? prFill : mix(COL.hairS, COL.ink, prIn));
    prText.setAttribute("fill", prLive > 0 ? mix(COL.ink, COL.raised, prLive) : mix(COL.muted, COL.ink, prIn));
    opBox.setAttribute("stroke", mix(COL.hairS, COL.ink, prIn));
    opText.setAttribute("fill", mix(COL.muted, COL.ink, prIn));
    drawLine(prToRepo, INOUT(seg(t, ...LINE6)));
    const repoOn = seg(t, LINE6[0] + LINE6[1], 0.3);
    repoBox.setAttribute("stroke", mix(COL.hairS, COL.ink, repoOn));
    if (repoOn > 0) repoLabel.setAttribute("fill", mix(COL.muted, COL.ink, repoOn));
    fadeText(cap6, t, 34.0, COL.ink2, 0.3, 36.7);

    // ---- the camera, and the world clearing for the end card ----
    const c = camera(t);
    world.setAttribute("transform", `translate(${f3(c.tx)} ${f3(c.ty)}) scale(${c.k.toFixed(5)})`);
    world.setAttribute("opacity", f3(1 - seg(t, 37.0, 0.8)));

    // ---- beat 7: the mark builds cell by cell, then the card fades in, centred ----
    inkCells.forEach((e, i) => e.setAttribute("opacity", f3(seg(t, 37.6 + i * 0.1, 0.12))));
    outCells.forEach((e) => e.setAttribute("opacity", f3(seg(t, 38.0, 0.2))));
    endCell.setAttribute("opacity", f3(seg(t, 38.3, 0.12)));
    fadeText(endTitle, t, 38.5, COL.ink);
    fadeText(endLine, t, 38.65, COL.ink2);
    btns.forEach((b, i) => { b.box.setAttribute("opacity", f3(seg(t, 38.8 + i * 0.09, 0.2))); fadeText(b.text, t, 38.8 + i * 0.09, COL.ink); });
    fadeText(endAddr, t, 39.05, COL.ink2);
    fadeText(endNote, t, 39.15, COL.ink2);
  }

  // ---- checks: one accent element per frame (a [data-one] group counts once) ----
  window.__accents = () => {
    const red = (cl) => { if (!cl || cl[0] !== "#" || cl.length !== 7) return false; const [rr, gg, bb] = hex(cl); return rr - gg > 60 && rr - bb > 40; };
    const seen = new Set();
    document.querySelectorAll("#s *").forEach((el) => {
      if (!(red(el.getAttribute("fill")) || red(el.getAttribute("stroke")))) return;
      let o = 1, key = el;
      for (let q = el; q && q.id !== "s"; q = q.parentNode) { o *= +(q.getAttribute("opacity") ?? 1); if (q.hasAttribute && q.hasAttribute("data-one")) key = q; }
      if (o > 0.02) seen.add(key);
    });
    return seen.size;
  };
  window.seek = (t) => draw(clamp(t, 0, D));
  window.__duration = D;
  Promise.all(["700 104px Archivo", "700 80px Archivo", "650 46px Archivo", "400 34px Archivo", "400 30px Archivo"].map((f) => document.fonts.load(f)))
    .then(() => document.fonts.ready)
    .then(() => {
      measure();
      draw(0);
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.to(clock, { t: D, duration: D, ease: "none", onUpdate: () => draw(clock.t) }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    });
})();
</script>
</body>
</html>
