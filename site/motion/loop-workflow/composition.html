<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1600, height=640" />
<title>Development loop</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
/*{{DS_CSS}}*/
html, body { width: 1600px; height: 640px; }
#stage { position: absolute; inset: 0; background: var(--bg); }
#stage > svg { position: absolute; left: 0; top: 0; }
#stage text { white-space: pre; }
/* drawn heavier than the 1200-wide loops: this one is shown smaller against its frame */
#stage .ln-2 { stroke-width: 1.5; }
#stage .datum { stroke-width: 3; }
#stage .st-ring { stroke-width: 2; }
#stage .st-x { stroke-width: 1.25; }
#stage .dash-h { stroke-width: 1.5; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="12" data-width="1600" data-height="640">
  <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="0"></div>
</div>
<script>
//{{DS_JS}}
</script>
<script>
(function () {
  // Shown at about 1150 px wide (330 on phones): smallest text 24 px, main labels 40 px.
  // The README's development loop on one datum. After Ship the loop closes through docs/:
  // the docs/ glyph rides the return line back to Orient, where the next feature starts.
  const { S, svg, G, T, L, P, R, station, head, fileGlyph, draw, C } = DS;
  function build() {
    const tl = gsap.timeline({ paused: true });
    const s = svg(document.getElementById("stage"), 1600, 640);
    const DY = 230, RY = 510, LX = 84, EX = 1516;
    const xs = [0, 1, 2, 3, 4, 5].map((k) => 170 + k * 252);
    const NAMES = ["Orient", "Ideate", "Design", "Plan", "Build", "Ship"];

    // ---- the datum and the return line through docs/ ----
    L(s, xs[0], DY, xs[5], DY, "ln-2");
    P(s, `M${xs[5]} ${DY} H${EX} V${RY} H${LX} V${DY} H${xs[0] - 30}`, "ln-2");
    head(s, xs[0] - 26, DY, 0, 13, "ahm");
    const back = T(s, (LX + EX) / 2, RY + 60, "", "t-mono", 26, "middle");
    const b1 = S("tspan", { fill: C.ink2 }, back); b1.textContent = "next session reads ";
    const b2 = S("tspan", {}, back); b2.textContent = "docs/";
    // the ink line the tracer leaves behind, one segment per step
    const segs = xs.slice(0, 5).map((x, k) => L(s, x, DY, xs[k + 1], DY, "datum"));
    gsap.set(segs, { strokeDasharray: "1 1", strokeDashoffset: 1 });

    // ---- the stations: number and name above, a ring on the datum ----
    const sts = xs.map((x, k) => {
      const st = station(s, x, DY, 12, 24);
      const lab = T(s, x, DY - 50, "", "t-head", 40, "middle");
      const n = S("tspan", { class: "t-mono", fill: C.muted, "font-size": 26 }, lab); n.textContent = String(k + 1);
      const nm = S("tspan", { dx: 12 }, lab); nm.textContent = NAMES[k];
      const dot = S("circle", { cx: x, cy: DY, r: 0, class: "fill-ink" }, s);
      return { ring: st.ring, dot };
    });
    // Ideate is optional: a dashed ring and a dashed tag
    sts[1].ring.setAttribute("stroke-dasharray", "4.7 3.8");
    const opt = T(s, xs[1], DY - 124, "optional", "t-mono", 24, "middle");
    opt.setAttribute("fill", C.muted);
    const ow = Math.ceil(opt.getComputedTextLength()) + 26;
    R(s, xs[1] - ow / 2, DY - 150, ow, 38, "dash-h");
    gsap.set(sts[0].ring, { fill: C.accent, stroke: C.accent });
    const tr = S("circle", { cx: xs[0], cy: DY, r: 8, class: "tracer" }, s);

    // ---- what happens at each step: a callout under the active station ----
    const DT = DY + 78;
    const STYLE = { b: ["t-mono-b", C.ink], p: ["t-mono", C.ink], n: ["t-mono", C.ink2] };
    const DETAILS = [
      [[["ab-resume-session", "b"]], [["reads ", "n"], ["docs/context/STATUS.md", "p"]]],
      [[["ab-ideation", "b"]], [["ranks improvement ideas", "n"]]],
      [[["ab-brainstorming", "b"]], [["approved design in ", "n"], ["docs/plans/", "p"]]],
      [[["ab-writing-plans", "b"]], [["tasks, tests, file paths", "n"]], [["then ", "n"], ["ab-deepen-plan", "b"]]],
      [[["test first", "p"]], [["verify with evidence", "p"]], [["helper review", "p"]]],
      [[["merge the branch", "n"]], [["ab-session-wrap", "b"], [" updates ", "n"], ["docs/", "p"]]],
    ];
    const TICKED = 4, IND = 44;
    const details = DETAILS.map((lines, k) => {
      const sx = xs[k];
      const lead = L(s, sx, DY + 30, sx, DT, "ln-2");
      const blk = G(s, 0, 0);
      const ind = k === TICKED ? IND : 0;
      const texts = lines.map((parts, i) => {
        const e = T(blk, 0, DT + 46 + i * 44, "", "t-mono", 28);
        parts.forEach(([str, st]) => {
          const sp = S("tspan", { class: STYLE[st][0], fill: STYLE[st][1] }, e);
          sp.textContent = str;
        });
        return e;
      });
      const w = Math.ceil(Math.max(...texts.map((e) => e.getComputedTextLength()))) + ind;
      const x0 = Math.round(Math.min(Math.max(sx - w / 2, LX + 34), EX - 34 - w));
      texts.forEach((e) => e.setAttribute("x", x0 + ind));
      const rule = [L(blk, sx, DT, x0, DT, "ln-2"), L(blk, sx, DT, x0 + w, DT, "ln-2")];
      const ticks = k === TICKED ? texts.map((e, i) => P(blk, `M${x0} ${DT + 46 + i * 44 - 10} l9 9 l17 -19`, "ln")) : [];
      gsap.set(lead, { strokeDasharray: "1 1", strokeDashoffset: 1 });
      gsap.set(rule.concat(ticks), { strokeDasharray: "1 1", strokeDashoffset: 1 });
      gsap.set(texts, { opacity: 0 });
      return { lead, blk, rule, texts, ticks };
    });
    gsap.set(details[TICKED].ticks, { strokeWidth: 2.25 });

    function showDetail(k, t) {
      const d = details[k];
      draw(tl, d.lead, t - 0.02, 0.26, { ease: "power2.out" });
      draw(tl, d.rule, t + 0.14, 0.4);
      if (d.ticks.length) {
        d.texts.forEach((e, i) => {
          const ti = t + 0.24 + i * 0.3;
          draw(tl, d.ticks[i], ti, 0.3, { ease: "power2.out" });
          tl.fromTo(e, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out", immediateRender: false }, ti + 0.06);
        });
      } else {
        tl.fromTo(d.texts, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out", stagger: 0.09, immediateRender: false }, t + 0.2);
      }
    }
    // the old callout leaves in the direction of travel before the next one draws
    function hideDetail(k, t) {
      const d = details[k];
      tl.to(d.blk, { x: 16, duration: 0.24, ease: "power4.in" }, t);
      tl.to([d.blk, d.lead], { opacity: 0, duration: 0.2, ease: "none" }, t);
    }
    function activate(k, t) {
      tl.to(sts[k].ring, { fill: C.accent, stroke: C.accent, duration: 0.18, ease: "power2.out" }, t);
    }
    // a finished station returns to ink and keeps a dot
    function finish(k, t) {
      tl.to(sts[k].ring, { fill: C.bg, stroke: C.ink, duration: 0.18, ease: "power2.out" }, t);
      tl.fromTo(sts[k].dot, { attr: { r: 0 } }, { attr: { r: 5 }, duration: 0.35, ease: "expo.out", immediateRender: false }, t + 0.06);
    }

    // ---- the run: arrive, work, leave ----
    const HOP = 0.42;
    const DEP = [1.1, 2.42, 3.99, 5.66, 7.43, 8.85];
    const ARR = [0].concat(DEP.slice(0, 5).map((d) => d + HOP));
    showDetail(0, 0.1);
    for (let k = 0; k < 5; k++) {
      finish(k, DEP[k] - 0.02);
      tl.fromTo(tr, { attr: { cx: xs[k] } }, { attr: { cx: xs[k + 1] }, duration: HOP, ease: "power3.inOut", immediateRender: false }, DEP[k]);
      draw(tl, segs[k], DEP[k], HOP, { ease: "power3.inOut" });
      hideDetail(k, ARR[k + 1] - 0.22);
      activate(k + 1, ARR[k + 1] - 0.08);
      showDetail(k + 1, ARR[k + 1]);
    }

    // ---- Ship done: the tracer becomes docs/ and rides the return line home ----
    const car = G(s, 0, 0);
    const gin = G(car, 0, 0);
    const fg = fileGlyph(gin, -18, -23, 36, 46);
    gsap.set([fg.body, fg.fold], { stroke: C.accent, strokeWidth: 2 });
    gsap.set(fg.body, { fill: C.bg });
    const gLab = T(car, 0, -40, "docs/", "t-mono-b", 24, "middle");
    gsap.set(car, { x: EX, y: DY });
    gsap.set(gin, { scale: 0, transformOrigin: "50% 50%" });
    gsap.set(gLab, { opacity: 0 });

    const D5 = DEP[5];
    finish(5, D5 - 0.02);
    tl.fromTo(tr, { attr: { cx: xs[5] } }, { attr: { cx: EX }, duration: 0.3, ease: "power2.inOut", immediateRender: false }, D5);
    tl.fromTo(tr, { attr: { r: 8 } }, { attr: { r: 0 }, duration: 0.14, ease: "power2.in", immediateRender: false }, D5 + 0.26);
    tl.fromTo(gin, { scale: 0 }, { scale: 1, duration: 0.3, ease: "expo.out", immediateRender: false }, D5 + 0.3);
    // down, along the bottom (constant speed), up, and into Orient
    let t = D5 + 0.55;
    tl.fromTo(car, { y: DY }, { y: RY, duration: 0.45, ease: "power1.in", immediateRender: false }, t); t += 0.45;
    tl.to(gLab, { opacity: 1, duration: 0.2, ease: "power2.out" }, t);
    tl.fromTo(car, { x: EX }, { x: LX, duration: 1.3, ease: "none", immediateRender: false }, t); t += 1.3;
    tl.to(gLab, { opacity: 0, duration: 0.18, ease: "power2.in" }, t - 0.22);
    tl.fromTo(car, { y: RY }, { y: DY, duration: 0.27, ease: "none", immediateRender: false }, t); t += 0.27;
    tl.fromTo(car, { x: LX }, { x: xs[0], duration: 0.16, ease: "power2.out", immediateRender: false }, t);
    // the glyph lands in Orient: the ring and the tracer take the accent back
    tl.to(gin, { scale: 0, duration: 0.2, ease: "power2.in" }, t - 0.04);
    activate(0, t + 0.14);
    tl.fromTo(tr, { attr: { cx: xs[0], r: 0 } }, { attr: { cx: xs[0], r: 8 }, duration: 0.18, ease: "expo.out", immediateRender: false }, t + 0.14);

    // ---- the next feature: the last callout leaves, the ink line and the dots clear ----
    hideDetail(5, 10.95);
    const dots = sts.map((x) => x.dot);
    tl.to(segs.concat(dots), { opacity: 0, duration: 0.4, ease: "power2.in" }, 11.05);
    tl.set(segs, { strokeDashoffset: 1, opacity: 1 }, 11.5);
    tl.set(dots, { attr: { r: 0 }, opacity: 1 }, 11.5);
    window.__timelines["main"] = tl;
  }
  DS.fontsReady().then(build);
})();
</script>
</body>
</html>
