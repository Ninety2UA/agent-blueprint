[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "notes"
version = "0.1.0"
description = "A small JSON-backed notes store with a command line"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
notes = "notes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
