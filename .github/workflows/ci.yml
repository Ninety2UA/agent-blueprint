name: CI

on:
  push:
    branches: [main, release/v4]
  # No base-branch filter: v4 phase PRs stack on release/v4 and on each other.
  pull_request:

jobs:
  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli

      # The glob covers eve/**/*.md, the chat template's markdown under eve/apps/web/ included;
      # eve's git-ignored build folders hold compiled skill copies and are left out.
      - name: Lint markdown files
        run: markdownlint '**/*.md' --ignore node_modules --ignore eve/node_modules --ignore eve/.eve --ignore eve/.output --ignore docs/images --ignore skills/ab-writing-skills

  install-test:
    name: Install Script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Direct routes and recorded-copy migrations (stub tools, isolated homes)
        run: python3 -m unittest tests/gates/test_install.py tests/gates/test_install_failures.py tests/gates/test_pi_source.py -v

      - name: Dry run reports absent tools
        run: |
          INSTALL_HOME=$(mktemp -d)
          trap 'rm -rf "$INSTALL_HOME"' EXIT
          set +e
          HOME="$INSTALL_HOME" PATH=/usr/bin:/bin bash install.sh --dry-run 2>&1 | tee /tmp/dry-run.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 1
          grep -q "not installed" /tmp/dry-run.log
          grep -q -- "--copy-dir" /tmp/dry-run.log

      - name: Copy install into a skills folder
        run: |
          INSTALL_HOME=$(mktemp -d)
          COPY_ROOT=$(mktemp -d)
          trap 'rm -rf "$INSTALL_HOME" "$COPY_ROOT"' EXIT
          HOME="$INSTALL_HOME" PATH=/usr/bin:/bin bash install.sh --copy-dir "$COPY_ROOT"
          SKILLS=$(find "$COPY_ROOT" -mindepth 2 -maxdepth 2 -name 'SKILL.md' | wc -l | tr -d ' ')
          EXPECTED=$(find skills -mindepth 2 -maxdepth 2 -name 'SKILL.md' | wc -l | tr -d ' ')
          echo "Skills: $SKILLS"
          test "$SKILLS" -eq "$EXPECTED"
          test -f "$COPY_ROOT/.agent-blueprint-install.json"
          grep -q '"ab-quick-fix"' "$COPY_ROOT/.agent-blueprint-install.json"
          test ! -e "$INSTALL_HOME/.agents/skills"

      - name: Scaffold a project
        run: |
          bash install.sh --scaffold /tmp/blueprint-test
          set -e
          test -f /tmp/blueprint-test/AGENTS.md
          test "$(cat /tmp/blueprint-test/CLAUDE.md)" = "@AGENTS.md"
          test -f /tmp/blueprint-test/.agent-blueprint/.gitignore
          test -f /tmp/blueprint-test/BACKLOG.md
          test -f /tmp/blueprint-test/blueprint.local.md
          test -f /tmp/blueprint-test/.gitignore
          for d in context plans specs decisions research solutions; do test -d /tmp/blueprint-test/docs/$d; done
          test -d /tmp/blueprint-test/src
          # A second run merges and changes nothing
          bash install.sh --scaffold /tmp/blueprint-test | tee /tmp/rerun.log
          grep -q "0 created, 0 merged" /tmp/rerun.log

      - name: Legacy mode is retired
        run: |
          set +e
          bash install.sh --legacy /tmp/never 2>&1 | tee /tmp/legacy.log
          code=${PIPESTATUS[0]}
          set -e
          test "$code" -eq 2
          grep -q "ab-migrate" /tmp/legacy.log

      - name: Verify plugin structure
        run: |
          set -e
          echo "Checking marketplace manifest..."
          test -f .claude-plugin/marketplace.json

          echo "Checking plugin root (the repository root is the plugin)..."
          test -f .claude-plugin/plugin.json
          test ! -e plugins
          test -f AGENTS.md
          test -L CLAUDE.md
          test "$(readlink CLAUDE.md)" = "AGENTS.md"

          echo "Checking plugin components..."
          test -d skills
          test ! -e agents   # v4: helper prompts live in skills/*/references/agents/
          test -d hooks
          test -f hooks/claude-code.json
          test -f hooks/codex.json
          test ! -e hooks/hooks.json   # Grok loads that conventional path from any plugin (KTD11)

          echo "Plugin structure valid!"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ShellCheck on install.sh
        run: shellcheck install.sh

      - name: Run ShellCheck on the ship runner
        run: shellcheck skills/ab-ship-pipeline/scripts/run.sh skills/ab-ship-pipeline/scripts/hosts.sh skills/ab-ship-pipeline/scripts/scan-secrets.sh skills/ab-ship-pipeline/scripts/outgoing-commits.sh

      - name: Run ShellCheck on the runner and hook tests
        run: shellcheck tests/runner/run-tests.sh tests/runner/fake-host.sh tests/hooks/run-tests.sh

      - name: Run ShellCheck on skill scripts
        run: shellcheck skills/*/scripts/*.sh

      # The smoke test itself never runs in CI (real hosts, real tokens); its scripts are linted here
      # and its selftest runs under Runner Tests.
      - name: Run ShellCheck on the smoke test
        run: shellcheck tests/smoke/*.sh tests/smoke/scenarios/*/*.sh

      - name: Run ShellCheck on check-drift.sh
        run: shellcheck scripts/check-drift.sh

      - name: Run ShellCheck on the site's Vercel ignore step
        run: shellcheck site/scripts/ignore-build.sh

      - name: Run ShellCheck on hook handlers
        run: shellcheck hooks/handlers/*.sh

  runner-tests:
    name: Runner Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # t62 needs a tr_TR locale that keeps I apart from i, as glibc's does; the Ubuntu image ships
      # none, and macOS's folds I as C does, so t62 skips there.
      - name: Turkish locale for t62
        if: matrix.os == 'ubuntu-latest'
        run: sudo locale-gen tr_TR.UTF-8

      # Every scenario drives the fake host in tests/runner/fake-host.sh; no real host runs.
      - name: Ship runner scenarios
        run: bash tests/runner/run-tests.sh

      # The smoke harness against its own fake host (tests/smoke/fake-host.sh): no real host, no
      # tokens; bash, git, python3 and pip's network access only. The eval part needs a v3 checkout
      # and is skipped; markdownlint has its own job.
      - name: Smoke harness selftest
        if: matrix.os == 'ubuntu-latest'
        env:
          SMOKE_SELFTEST_NO_LINT: "1"
        run: bash tests/smoke/selftest.sh

  drift-gate:
    name: Drift Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check count/version drift
        run: bash scripts/check-drift.sh

      # The frontmatter YAML check needs PyYAML; REQUIRE_YAML turns a missing
      # module into a failure here instead of a local-only skip.
      - name: Install PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q python3-yaml; }

      - name: Check skill-description collisions and skill structure
        env:
          REQUIRE_YAML: "1"
        run: python3 scripts/check-skill-collisions.py

  portability-gates:
    name: Portability Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the allowlist-base check reads the PR base's allowlist

      - name: Install PyYAML
        run: python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q python3-yaml; }

      # On pull requests, an allowlist entry that the base branch does not have
      # fails: the allowlists only shrink (KTD5).
      - name: Skill portability gate
        env:
          REQUIRE_YAML: "1"
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 scripts/check-portability.py --allowlist-base "origin/$BASE_REF"
          else
            python3 scripts/check-portability.py
          fi

      - name: Manifest gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python3 scripts/check-manifests.py --allowlist-base "origin/$BASE_REF"
          else
            python3 scripts/check-manifests.py
          fi

      - name: Shared-text copies match their owners
        run: python3 scripts/sync-shared.py --check

      - name: Gate unit tests
        run: python3 -m unittest discover -s tests/gates -v

  # The site is built from the skills and the README, so any pull request can change it.
  # check-site.py runs inside `npm run build` (the same command Vercel runs), so a failing
  # built-site check fails this job and the deployment alike.
  site:
    name: Site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install site dependencies
        run: npm ci

      - name: Type-check the site
        run: npx astro check

      - name: Build the site and run the built-site gate
        run: npm run build

      # The quoted glob: the bare folder form fails on Node 22 and later.
      - name: Site data tests
        working-directory: .
        run: node --test 'site/test/**/*.test.mjs'

      # The same build with the Hosted page previewed (site/src/lib/hosted-release.mjs). GitHub sets
      # CI=true on every step, so the override counts only beside VERCEL_ENV=preview.
      - name: Build the site with the Hosted page previewed
        env:
          AB_HOSTED_PREVIEW: "1"
          VERCEL_ENV: preview
        run: npm run build

      # With AB_HOSTED_PREVIEW=1 the tests fail on a build that left the page out.
      - name: Site data tests on the preview build
        working-directory: .
        env:
          AB_HOSTED_PREVIEW: "1"
          VERCEL_ENV: preview
        run: node --test 'site/test/**/*.test.mjs'

  # A workflow-level paths filter would gate every job here, so this job reads the pull request's
  # changed paths and the Eve job runs only when one is under eve/, skills/ or the prompt registry.
  eve-changes:
    name: Eve Paths
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      eve: ${{ steps.paths.outputs.eve }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2   # the pull request's merge commit and the base it merges into

      - name: Changed paths the Eve job watches
        id: paths
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          if printf '%s\n' "$changed" | grep -qE '^(eve/|skills/|scripts/prompt-owners\.json$)'; then
            echo "eve=true" >> "$GITHUB_OUTPUT"
          else
            echo "eve=false" >> "$GITHUB_OUTPUT"
          fi

  # The Eve host in eve/ (docs/learnings/2026-10-eve-host-decision.md). Every eval here is tagged
  # mock and runs on the scripted mock model; the job holds no Gateway key, so no run spends tokens.
  eve:
    name: Eve Host (mocked evals)
    needs: eve-changes
    if: needs.eve-changes.outputs.eve == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: eve
    # Test values for every channel, so each channel cell runs instead of skipping (KTD14 of the
    # channels plan). None is a credential: each reads as fake, and under AB_EVAL_MOCK=1 every
    # channel's API is a local stub (Slack 47821, Linear 47822, Telegram 47823, the OIDC issuer
    # 47824). The Telegram secret and both MCP tokens are 32 characters or more, as KTD2 requires.
    env:
      SLACK_BOT_TOKEN: xoxb-test-not-real
      SLACK_SIGNING_SECRET: test-signing-secret-not-real
      TELEGRAM_BOT_TOKEN: "123456:test-not-real"
      TELEGRAM_WEBHOOK_SECRET_TOKEN: test-webhook-secret-not-real-00000000000
      AB_TELEGRAM_USERS: "1001"
      AB_MCP_TOKEN: test-mcp-token-not-real-aaaaaaaaaaaaaaaa,test-mcp-token-not-real-bbbbbbbbbbbbbbbb
      LINEAR_CLIENT_ID: test-client-id-not-real
      LINEAR_CLIENT_SECRET: test-client-secret-not-real
      LINEAR_WEBHOOK_SECRET: test-webhook-secret-not-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: eve/package-lock.json

      # Without a Docker daemon eve's default sandbox falls back to just-bash, which is not the
      # sandbox the evals prove.
      - name: Docker is reachable
        run: docker info --format 'Docker {{.ServerVersion}}'

      # The pinned eve version names its sandbox base image, so the lockfile keys the cache.
      - name: Restore the sandbox base image
        id: sandbox-image
        uses: actions/cache@v4
        with:
          path: ~/.cache/eve-sandbox-image
          key: eve-sandbox-image-${{ runner.os }}-${{ hashFiles('eve/package-lock.json') }}

      - name: Load the cached sandbox base image
        if: steps.sandbox-image.outputs.cache-hit == 'true'
        run: if [ -f ~/.cache/eve-sandbox-image/base.tar ]; then docker load --input ~/.cache/eve-sandbox-image/base.tar; fi

      - name: Install eve dependencies
        run: npm ci

      - name: Build the agent
        run: npx eve build

      - name: Emitted skill modules match skills/
        run: python3 scripts/emit-skill-modules.py --check

      - name: Eve discovers every skill
        run: node scripts/check-skill-count.mjs

      - name: Unit tests
        run: npm test

      - name: Type-check the agent
        run: npm run typecheck

      # The channels read their configuration when the server starts, so each configuration is its
      # own pass, and every cell skips itself on the passes it does not belong to.
      # The main pass: every channel configured, MCP on its token with OAuth off.
      - name: Mocked evals
        env:
          AB_EVAL_MOCK: "1"
        run: npx eve eval --tag mock --json --junit out.xml

      # The MCP OAuth cells: the eval stands up the issuer on 47824 and signs its own test tokens.
      - name: Mocked evals, MCP with OAuth on
        env:
          AB_EVAL_MOCK: "1"
          AB_MCP_OAUTH_ISSUER: http://127.0.0.1:47824
          AB_MCP_OAUTH_SUBJECTS: eval-user-listed
        run: npx eve eval mcp --tag mock --json --junit out-oauth.xml

      # A server booted in maintenance (KTD9): maintenance.eval.ts and the Linear and MCP maintenance
      # cells. One at a time, because the Linear cells share the stub's port.
      - name: Mocked evals, maintenance
        env:
          AB_EVAL_MOCK: "1"
          AB_MAINTENANCE: "1"
        run: npx eve eval maintenance linear mcp --tag mock --max-concurrency 1 --json --junit out-maintenance.xml

      # Linear with its client secret unset: a signed event starts nothing (KTD2).
      - name: Mocked evals, Linear unconfigured
        env:
          AB_EVAL_MOCK: "1"
          LINEAR_CLIENT_SECRET: ""
        run: npx eve eval linear --tag mock --json --junit out-linear-unconfigured.xml

      # The demo's cells: caps, busy limits, the day's 402, memory per session and a bare request on
      # the demo's repository (ruling 65), and BACKLOG.md kept out of a visitor's pull request (ruling 78).
      - name: Mocked evals, the demo
        env:
          AB_EVAL_MOCK: "1"
          AB_DEMO: "1"
          AB_TRUST_PROXY: "1"
          EVE_CHAT_PASSWORD: test-demo-code-not-real
        run: npx eve eval gate demo-repository --tag mock --json --junit out-demo.xml

      - name: Keep the sandbox base image for the cache
        if: steps.sandbox-image.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/eve-sandbox-image
          images=$(docker image ls ghcr.io/vercel/eve --format '{{.Repository}}:{{.Tag}}')
          if [ -n "$images" ]; then printf '%s\n' "$images" | xargs docker save --output ~/.cache/eve-sandbox-image/base.tar; fi

  plugin-validate:
    name: Plugin Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Unpinned on purpose: a new validator rule is a platform-currency signal,
      # not a silent skip. Isolated from the drift gate so a CLI install failure
      # cannot turn the python gate red.
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # The root holds both manifests; validating "." checks only the marketplace,
      # so the plugin manifest (which also flags a regular-file CLAUDE.md) runs by path.
      - name: Validate plugin manifest
        run: claude plugin validate --strict --json .claude-plugin/plugin.json

      - name: Validate marketplace manifest
        run: claude plugin validate --strict --json .
